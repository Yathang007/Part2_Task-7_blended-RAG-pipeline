version: 1
name: blended-rag-pipeline
description: >-
  DevDocs Intelligence: hybrid technical-documentation retrieval using BM25,
  FAISS dense search, and Reciprocal Rank Fusion, with optional local Ollama
  answer generation.
commands:
  install: "python -m pip install -r requirements.txt"
  test: "python -m pytest -q tests"
  ingest_check: "python -m scripts.ingest_docs --directory data/raw"
  launch: "python -m streamlit run src/app.py"
